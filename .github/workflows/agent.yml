name: Agent task boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install '.[vision,evaluation]'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Installed command entry points
        working-directory: ${{ runner.temp }}
        run: |
          robot-agent-handoff --help
          robot-agent-navigation --help
          robot-agent-navigation-host-proposal --version
          python -m robot_agent.navigation_host_model --help
          robot-agent-evaluate-handoff --help
          python -m robot_agent.prepare_aloha --help
