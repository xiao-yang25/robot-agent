[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-agent"
version = "0.1.0a1"
description = "Bounded observation-driven task applications for Robot Harness"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE"]

[project.optional-dependencies]
vision = ["Pillow>=10,<13"]
evaluation = ["numpy>=1.24,<3"]

[project.scripts]
robot-agent-handoff = "robot_agent.cli:main"
robot-agent-navigation = "robot_agent.navigation_cli:main"
robot-agent-navigation-host-proposal = "robot_agent.navigation_host_proposal:main"
robot-agent-navigation-controlled = "robot_agent.navigation_controlled_proposal:main"
robot-agent-evaluate-handoff = "robot_agent.evaluate_handoff:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_agent = ["handoff_profile.json"]
